set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

set theme=/boot/grub/live-theme/theme.txt
loadfont /boot/grub/live-theme/dejavu22.pf2
loadfont /boot/grub/live-theme/dejavu16.pf2
terminal_output gfxterm

